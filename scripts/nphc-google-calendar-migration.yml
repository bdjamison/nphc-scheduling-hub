name: One-time Google Calendar migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type GOOGLE_WINS_REMOVE_AZURE to authorize the migration'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: nphc-google-calendar-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: inputs.confirm == 'GOOGLE_WINS_REMOVE_AZURE'
    runs-on: ubuntu-latest
    environment: nphc-production-migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install azure-identity azure-data-tables
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Import 323 approved appointments
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: |
          python scripts/import-google-approved.py --apply --confirm "${{ inputs.confirm }}"
      - name: Upload private migration backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nphc-google-migration-backup
          path: ${{ runner.temp }}/google-migration-backup.json
          if-no-files-found: warn
          retention-days: 1
